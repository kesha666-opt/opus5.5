<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <script>
      // A downloaded HTML file cannot save settings to the running server.
      if (location.protocol === "file:") location.replace("http://127.0.0.1:8182/admin");
      else if (location.search) history.replaceState(null, "", location.pathname);
    </script>
    <title>FUNTIKSTORE — NVIDIA NIM setup</title>
    <link rel="license" href="https://github.com/kesha666-opt/opus5.5" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/admin/assets/__FCC_VERSION__/opus.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-labelledby="title">
        <div class="mascot" aria-label="FUNTIKSTORE">
          <img src="/admin/assets/__FCC_VERSION__/brand/funtikstore-logo.png" alt="FUNTIKSTORE — EvilDigitalShit" />
        </div>
        <div class="intro"><h1 id="title">NVIDIA NIM API</h1></div>

        <noscript>Enable JavaScript and open http://127.0.0.1:8182/admin.</noscript>
        <form id="keyForm" method="post" novalidate>
          <label class="sr-only" for="apiKey">NVIDIA API key</label>
          <div class="input-wrap">
            <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="nvapi-" maxlength="4096" disabled />
            <button id="toggleKey" class="icon-button reveal" type="button" aria-label="Show key"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.3 3.7 20.4 21.8M9.7 9.8a3.2 3.2 0 0 0 4.5 4.5M6.4 6.6C4.1 8.2 2.5 10.5 2 12c1.3 3.3 5.1 6 10 6 1.6 0 3.1-.3 4.4-.9M10 6.1c.7-.2 1.3-.3 2-.3 4.9 0 8.7 2.7 10 6.2-.5 1.2-1.6 2.8-3.2 4.1M13.8 8.3a3.2 3.2 0 0 1 2 2"/></svg></button>
            <button id="clearKey" class="icon-button clear" type="button" aria-label="Clear key" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
            <button id="saveButton" class="submit-button" type="submit" aria-label="Save API key" disabled><span aria-hidden="true">→</span></button>
          </div>
          <div id="status" class="status neutral" role="status" aria-live="polite">
            <span class="paw" aria-hidden="true">🐾</span>
            <div>
              <strong id="statusTitle">FUNTIKSTORE • NVIDIA NIM</strong>
              <p id="statusText" hidden></p>
            </div>
          </div>
        </form>
      </section>
    </main>
    <script src="/admin/assets/__FCC_VERSION__/opus.js"></script>
    <script src="/admin/assets/__FCC_VERSION__/funtik-mascot.js"></script>
  </body>
</html>
