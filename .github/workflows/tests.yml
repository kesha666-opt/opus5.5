name: Opus 5.5 verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      OPUS_REF: ${{ github.sha }}
      OPUS_NO_OPEN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        if: runner.os != 'Windows'
        with:
          version: '0.12.17'
      - name: Install from public GitHub archive (Unix)
        if: runner.os != 'Windows'
        run: |
          sh scripts/install.sh
          sh scripts/install.sh
      - name: Install from public GitHub archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy RemoteSigned -Force
          if (Get-Command uv -ErrorAction SilentlyContinue) { throw 'Windows bootstrap test unexpectedly found uv preinstalled' }
          $installer = [scriptblock]::Create([IO.File]::ReadAllText((Resolve-Path './scripts/install.ps1')))
          & $installer -Ref $env:GITHUB_SHA -NoOpen -ForceGitBashBootstrap
          if (-not (Test-Path $env:CLAUDE_CODE_GIT_BASH_PATH)) { throw 'Git Bash bootstrap failed' }
          & $env:CLAUDE_CODE_GIT_BASH_PATH --version
          if ($LASTEXITCODE -ne 0) { throw 'Git Bash did not start' }
          & $installer -Ref $env:GITHUB_SHA -NoOpen
          $windowsRoot = [Environment]::GetFolderPath('Windows')
          $env:SystemRoot = $windowsRoot
          $env:ComSpec = Join-Path $windowsRoot 'System32\cmd.exe'
          "SystemRoot=$windowsRoot" >> $env:GITHUB_ENV
          "ComSpec=$(Join-Path $windowsRoot 'System32\cmd.exe')" >> $env:GITHUB_ENV
          Join-Path $HOME '.local\bin' >> $env:GITHUB_PATH
          $env:PATH = "$(Join-Path $HOME '.local/bin')$([IO.Path]::PathSeparator)$env:PATH"
          $health = Invoke-RestMethod http://127.0.0.1:8182/health
          if ($health.service -ne 'opus5.5') { throw 'Wrong Windows server' }
          $panel = Invoke-WebRequest http://127.0.0.1:8182/admin
          if ($panel.Content -notmatch 'Opus 5.5' -or $panel.Content -notmatch 'type="password"') { throw 'Windows panel missing' }
          fcc-opus --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows client alias failed' }
      - name: Verify Unix server, panel and client
        if: runner.os != 'Windows'
        shell: pwsh
        run: |
          $health = Invoke-RestMethod http://127.0.0.1:8182/health
          if ($health.service -ne 'opus5.5') { throw 'Wrong server' }
          $panel = Invoke-WebRequest http://127.0.0.1:8182/admin
          if ($panel.Content -notmatch 'Opus 5.5' -or $panel.Content -notmatch 'type="password"') { throw 'Panel missing' }
          $env:PATH = "$(Join-Path $HOME '.local/bin')$([IO.Path]::PathSeparator)$env:PATH"
          fcc-claude --version
          if ($LASTEXITCODE -ne 0) { throw 'Client launch failed' }
          fcc-opus --version
          if ($LASTEXITCODE -ne 0) { throw 'Client alias failed' }
      - name: Server startup diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-Content (Join-Path $HOME '.opus5.5/logs/launcher.log') -ErrorAction SilentlyContinue
          Get-Content (Join-Path $HOME '.opus5.5/logs/launcher-error.log') -ErrorAction SilentlyContinue
      - name: Full unit tests
        run: uv run pytest -q -n 2 tests
      - name: Lint and types
        run: |
          uv run ruff check
          uv run ty check
      - name: Current key panel browser tests
        run: |
          uv run playwright install --with-deps chromium
          uv run pytest -q -n 0 e2e/test_opus_panel.py
