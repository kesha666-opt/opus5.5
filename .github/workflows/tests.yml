name: Nova Code verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      NOVA_REF: ${{ github.sha }}
      NOVA_NO_OPEN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - name: Install from private GitHub archive (Unix)
        if: runner.os != 'Windows'
        run: sh scripts/install.sh
      - name: Install from private GitHub archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1 -Ref $env:GITHUB_SHA -NoOpen
      - name: Verify Unix server, panel and client
        if: runner.os != 'Windows'
        shell: pwsh
        run: |
          $health = Invoke-RestMethod http://127.0.0.1:8182/health
          if ($health.service -ne 'nova-code-bridge') { throw 'Wrong server' }
          $panel = Invoke-WebRequest http://127.0.0.1:8182/admin
          if ($panel.Content -notmatch 'Nova Code' -or $panel.Content -notmatch 'type="password"') { throw 'Panel missing' }
          $env:PATH = "$(Join-Path $HOME '.local/bin')$([IO.Path]::PathSeparator)$env:PATH"
          fcc-claude --version
          if ($LASTEXITCODE -ne 0) { throw 'Client launch failed' }
      - name: Verify Windows client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$(Join-Path $HOME '.local/bin')$([IO.Path]::PathSeparator)$env:PATH"
          fcc-claude --version
          if ($LASTEXITCODE -ne 0) { throw 'Client launch failed' }
      - name: Server startup diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-Content (Join-Path $HOME '.nova-code/logs/launcher.log') -ErrorAction SilentlyContinue
          Get-Content (Join-Path $HOME '.nova-code/logs/launcher-error.log') -ErrorAction SilentlyContinue
      - name: Focused tests
        run: uv run pytest -q -n 0 tests/nova tests/cli/test_claude_launcher.py tests/providers/test_nvidia_nim.py tests/providers/test_nvidia_nim_native_tool_stream.py
