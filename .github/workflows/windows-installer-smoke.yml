name: Windows installer smoke

on:
  push:
    branches:
      - fix-windows-clean-bootstrap
    paths:
      - scripts/install-windows.ps1
      - src/free_claude_code/api/admin_routes.py
      - src/free_claude_code/api/admin_static/**
      - tests/api/test_admin.py
      - .github/workflows/windows-installer-smoke.yml
  pull_request:
    paths:
      - scripts/install-windows.ps1
      - src/free_claude_code/api/admin_routes.py
      - src/free_claude_code/api/admin_static/**
      - tests/api/test_admin.py
      - .github/workflows/windows-installer-smoke.yml
  workflow_dispatch:

jobs:
  fresh-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install with no Python, uv, or WinGet on PATH
        shell: powershell
        env:
          OPUS_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "$env:WINDIR\System32;$env:WINDIR;$env:WINDIR\System32\WindowsPowerShell\v1.0"
          foreach ($name in @('python', 'uv', 'winget')) {
            if (Get-Command $name -ErrorAction SilentlyContinue) { throw "$name unexpectedly found on PATH" }
          }
          $stateDir = Join-Path $HOME '.opus5.5'
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          Set-Content -Path (Join-Path $stateDir '.env') -Value "HOST=127.0.0.1`nPORT=8182`nNVIDIA_NIM_API_KEY=nvapi-existing-smoke-key`n" -NoNewline
          & .\scripts\install-windows.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Installer failed: $LASTEXITCODE" }
          & "$HOME\.local\bin\claude.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Claude Code did not start' }
          & "$HOME\.local\bin\fcc-opus.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Opus client did not start' }
          $health = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8182/health' -TimeoutSec 5
          if ($health.StatusCode -ne 200) { throw 'Local server is not healthy' }
          $envFile = Join-Path $stateDir '.env'
          if (-not ((Get-Content -Raw $envFile) -match 'NVIDIA_NIM_API_KEY=nvapi-existing-smoke-key')) { throw 'Installer erased the existing API key' }
          $adminUrl = 'http://127.0.0.1:8182/admin/api'
          $saved = Invoke-RestMethod -Uri "$adminUrl/opus/configure" -Method Post -ContentType 'application/json' -Body '{"api_key":"nvapi-fake-smoke-key"}' -TimeoutSec 10
          if (-not $saved.ok) { throw 'Admin panel did not confirm the saved key' }
          $config = Invoke-RestMethod -Uri "$adminUrl/config" -TimeoutSec 10
          $key = $config.fields | Where-Object { $_.key -eq 'NVIDIA_NIM_API_KEY' }
          if (-not $key.configured -or $key.source -ne 'managed_env' -or $key.value -ne '********') { throw 'Admin panel did not report the saved key as configured and masked' }
          if (-not (Test-Path $envFile) -or -not ((Get-Content -Raw $envFile) -match 'NVIDIA_NIM_API_KEY=nvapi-fake-smoke-key')) { throw 'Admin panel did not persist the key on Windows' }
